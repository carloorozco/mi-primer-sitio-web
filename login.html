<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Alumnos - UNIAT</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="cbtis-login-body">

    <!-- Contenedor principal de dos columnas -->
    <div class="cbtis-login-container">

        <!-- LADO IZQUIERDO: Panel Azul con Bienvenida e Ilustración -->
        <div class="cbtis-left-panel">
            <div class="cbtis-left-content">
                
        <header class="navbar">
         <div class="nav-container">
                <div class="nav-brand">
                       <a href="#inicio">
                           <img src="img/logo_uniat.png"alt="CBTis 166" class="brand-logo-img">
                       </a>
                </div>
         </div>
        </header>

                <div class="cbtis-illustration-box">
                    <div class="cbtis-badge-icon">👨‍🎓📖</div>
                    <h2>¡BIENVENIDO A NUESTRO ESTUDIANTE!</h2>
                </div>

                <div class="cbtis-notices-box">
                    <h3>¡Avisos!</h3>
                    <p>Consulta tus calificaciones, horarios y avisos oficiales del CBTis 166 de manera rápida y segura. Turno Vespertino.</p>
                </div>

                <div class="cbtis-slider-dots">
                    <span class="cbtis-dot active"></span>
                    <span class="cbtis-dot"></span>
                    <span class="cbtis-dot"></span>
                </div>
            </div>

            <div class="cbtis-left-footer">
                UNIAT &copy; 2026<br>
                <span>Aviso de privacidad | Términos y condiciones</span>
            </div>
        </div>

        <!-- LADO DERECHO: Panel Blanco con el Formulario de Acceso -->
        <div class="cbtis-right-panel">
            <div class="cbtis-login-wrapper">
                
                <div class="login-back-container">
                    <a href="index.html" class="cbtis-back-link">← Regresar al inicio</a>
                </div>

    <header class="navbar">
        <div class="nav-container">
                <div class="nav-brand">
                       <a href="#inicio">
                           <img src="img/logo_uniat.png" alt="CBTis 166" class="brand-logo-img">
                       </a>
                </div>
        </div>
    </header>

                <form id="form-login" action="#" method="POST">
                    
                    <div class="cbtis-input-group">
                        <label for="usuario">Usuario o matrícula</label>
                        <input type="text" id="usuario" name="usuario" placeholder="Ej: Carl" required>
                    </div>

                    <div class="cbtis-input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="cbtis-input-group form-group-margin">
                            <select id="info_carrera" name="carrera" required class="form-control-select">
                                <option value="">Carrera</option>
                                <option value="animacion">Licenciatura en Cine y Animacion Digital</option>
                                <option value="diseño">Licenciatura en Diseño y Arte para Videojuegos</option>
                                <option value="programacion">Ingenieria en Programacion de Videojuegos</option>
                                <option value="arquitectura">Licenciatura en Arquitectura 3D</option>
                                <option value= "marketing">Licenciatura en Marketing Digital</option>
                                <option value= "ciberseguridad"> Maestria en Ciberseguridad</option>
                            </select>
                        </div>

                    <button type="submit" class="cbtis-btn-ingresar">INGRESAR</button>

                </form>

                <div class="cbtis-login-help">
                    <a href="#">Tengo dudas</a> | <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
